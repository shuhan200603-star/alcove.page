<!DOCTYPE html>
<html lang="zh-CN" data-theme="lavender" data-font="wenkai">
<head>
<meta charset="utf-8">
<title>Alcove</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alcove">
<meta name="theme-color" content="#e8e4f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/lxgwwenkai-regular.css">
<link rel="stylesheet" href="fonts/lxgwwenkai-light.css">
<link rel="icon" id="fav" href="icons/night.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="fav-apple" href="icons/night-180.png">

<style>
/* ============================================================
   Alcove — 液态玻璃聊天前端
   玻璃 = 悬浮层透出下方背景（backdrop-filter），内容本身永远清晰。
   ============================================================ */

:root{
  --r-lg: 26px;
  --r-md: 20px;
  --r-sm: 14px;
  --ease: cubic-bezier(.32,.72,0,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* 导航栏占掉的高度。打字时导航条滑下去，--nav-h 归零，
     输入条和滚动区的留白跟着一起收——所以只需要改这一个数。 */
  --nav-h: 66px;
  --nav-total: calc(var(--nav-h) + var(--safe-b));
}
body.typing{--nav-h:0px}

/* ---- 四套字体 ----
   楷体笔画本身就有粗细变化，字重压低才不会糊成一团；
   黑体则需要正常的字重层次。所以两个字重变量跟着字体走。 */
[data-font="wenkai"]{
  --font:'LXGW WenKai',"STKaiti","Kaiti SC",-apple-system,"PingFang SC",serif;
  --w-strong:400; --w-med:400; --track:.3px;
}
[data-font="wenkai-light"]{
  --font:'LXGW WenKai Light','LXGW WenKai',"STKaiti","Kaiti SC",-apple-system,"PingFang SC",serif;
  --w-strong:400; --w-med:300; --track:.3px;
}
[data-font="kai"]{
  --font:"STKaiti","Kaiti SC","KaiTi","楷体",-apple-system,"PingFang SC",serif;
  --w-strong:600; --w-med:400; --track:.3px;
}
[data-font="sans"]{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --w-strong:650; --w-med:560; --track:.2px;
}

/* ---- 四套主题 ---- */
[data-theme="lavender"]{
  --bg-1:#ece7f6; --bg-2:#f6eef7; --bg-3:#e3e9f8;
  --blob-a:#c9b8ea; --blob-b:#f0c9e4; --blob-c:#b9c8f0;
  --ink:#2c2838; --ink-soft:#6d6880;
  --accent:#7b68ae; --accent-ink:#fff;
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.78);
  --glass-line:rgba(255,255,255,.85);
  --glass-shadow:rgba(60,48,90,.13);
  --swatch:linear-gradient(135deg,#d9c2f0,#b8c9ef);
}
[data-theme="lime"]{
  --bg-1:#e9f2e2; --bg-2:#f4f8e9; --bg-3:#e2f0e8;
  --blob-a:#c2e29a; --blob-b:#e6f2b8; --blob-c:#a8dcc4;
  --ink:#26301f; --ink-soft:#66735c;
  --accent:#6f9440; --accent-ink:#fff;
  --glass:rgba(255,255,255,.64);
  --glass-strong:rgba(255,255,255,.8);
  --glass-line:rgba(255,255,255,.88);
  --glass-shadow:rgba(50,70,35,.12);
  --swatch:linear-gradient(135deg,#c8e89b,#9fd98c);
}
[data-theme="milktea"]{
  --bg-1:#f2ebe0; --bg-2:#f9f3ea; --bg-3:#efe4d6;
  --blob-a:#e0c9a8; --blob-b:#f2e0c6; --blob-c:#d9bfa0;
  --ink:#332a20; --ink-soft:#7a6a58;
  --accent:#a8825c; --accent-ink:#fff;
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.8);
  --glass-line:rgba(255,255,255,.88);
  --glass-shadow:rgba(80,60,40,.13);
  --swatch:linear-gradient(135deg,#e8d0ac,#cfa87c);
}
[data-theme="rose"]{
  --bg-1:#f6e7ee; --bg-2:#faf0f3; --bg-3:#eee4f0;
  --blob-a:#e8c2d4; --blob-b:#d3c2e6; --blob-c:#f7d9e0;
  --blob-op:.46; --blob-blur:96px;
  --ink:#3b2f36; --ink-soft:#8d7a84;
  --accent:#8a6ba0; --accent-ink:#fff;
  --glass:rgba(255,255,255,.66);
  --glass-strong:rgba(255,255,255,.82);
  --glass-line:rgba(255,255,255,.9);
  --glass-shadow:rgba(88,60,76,.11);
  --swatch:linear-gradient(135deg,#eed4de,#c9b4dc);
}
/* 落花：底子是白的，颜色全在四角那点极淡的晕和花上。
   白底上白玻璃会消失，所以这套的 --glass-line 是粉的——
   气泡和输入条靠那道发丝线站住，不靠明度差。 */
[data-theme="bloom"]{
  --bg-1:#fffefe; --bg-2:#ffffff; --bg-3:#fffcfd;
  --blob-a:#fbeaf0; --blob-b:#f4eefa; --blob-c:#fdf1f5;
  --blob-op:.34; --blob-blur:110px;
  --petal:#e7c0d0; --petal-op:.5;
  --ink:#3a2f35; --ink-soft:#8b7883;
  --accent:#8a6ba0; --accent-ink:#fff;
  --glass:rgba(255,255,255,.78);
  --glass-strong:rgba(255,255,255,.9);
  --glass-line:rgba(224,196,211,.55);
  --glass-shadow:rgba(150,108,130,.13);
  --swatch:radial-gradient(circle at 50% 50%,#e7c0d0 0 34%,#fffdfe 36%);
}
[data-theme="night"]{
  --bg-1:#171526; --bg-2:#1d1b30; --bg-3:#121324;
  --blob-a:#3c3566; --blob-b:#2a3a5e; --blob-c:#4a3560;
  --ink:#e9e6f2; --ink-soft:#9d98b4;
  --accent:#8878c4; --accent-ink:#fff;
  --glass:rgba(255,255,255,.075);
  --glass-strong:rgba(255,255,255,.11);
  --glass-line:rgba(255,255,255,.16);
  --glass-shadow:rgba(0,0,0,.4);
  --swatch:linear-gradient(135deg,#2b2a4a,#1b2340);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
/* 放 <symbol> 的那个空 svg 仍然是行内元素，留在文档流里会顶出一行的高度，
   把整个 #app 往下推。挪出流外。 */
#defs{position:absolute; width:0; height:0}
body{
  font:16px/1.62 var(--font);
  color:var(--ink);
  background:var(--bg-2);
  -webkit-font-smoothing:antialiased;
}

/* ---- 背景：缓慢流动的色团，玻璃层折射的就是它 ---- */
#bg{position:fixed; inset:0; z-index:0; overflow:hidden; background:linear-gradient(165deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3))}
#bg i{position:absolute; display:block; border-radius:50%;
     filter:blur(var(--blob-blur,70px)); opacity:var(--blob-op,.55); will-change:transform}
#bg i:nth-child(1){width:70vw;height:70vw;left:-18vw;top:-14vh;background:var(--blob-a); animation:drift1 26s var(--ease) infinite alternate}
#bg i:nth-child(2){width:62vw;height:62vw;right:-20vw;top:22vh;background:var(--blob-b); animation:drift2 31s var(--ease) infinite alternate}
#bg i:nth-child(3){width:78vw;height:78vw;left:-10vw;bottom:-24vh;background:var(--blob-c); animation:drift3 37s var(--ease) infinite alternate}
@keyframes drift1{to{transform:translate3d(14vw,10vh,0) scale(1.14)}}
@keyframes drift2{to{transform:translate3d(-16vw,-8vh,0) scale(.88)}}
@keyframes drift3{to{transform:translate3d(10vw,-12vh,0) scale(1.1)}}
@media (prefers-reduced-motion:reduce){#bg i{animation:none}}

/* ---- 落花 ----
   只有 --petal-op 非 0 的主题看得见（默认 0）。压在两侧和四角，
   中间那条留给文字。飘动幅度很小——余光里动一下就够了，
   动大了会跟正在读的字抢注意力。 */
#petals{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  color:var(--petal,#e7c0d0); opacity:var(--petal-op,0); transition:opacity .6s;
}
.pt{
  position:absolute; fill:currentColor;
  animation:sway 30s var(--ease) infinite alternate; will-change:transform;
}
@keyframes sway{
  from{transform:translate3d(0,0,0) rotate(var(--r))}
  to  {transform:translate3d(var(--dx),var(--dy),0) rotate(calc(var(--r) + 9deg))}
}
@media (prefers-reduced-motion:reduce){.pt{animation:none}}

/* ---- 玻璃基类 ---- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glass-line);
  box-shadow:0 8px 30px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="night"] .glass{box-shadow:0 8px 30px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.09)}

/* ============ 布局 ============ */
#app{position:relative; z-index:1; height:100%; display:flex; flex-direction:column}

/* 五个 tab 各占一整块，同一时刻只显示一个。用 display 切换而不是
   卸载重建：切走再切回来，滚动位置和输入框里没发出去的字都还在。 */
#views{position:relative; flex:1; min-height:0}
.view{position:absolute; inset:0; display:none; flex-direction:column}
.view.on{display:flex}
/* 聊天以外的页面：自己滚，底部给导航条让出位置 */
.page{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:14px 16px calc(var(--nav-total) + 28px);
}
.page .inner{max-width:760px; margin:0 auto}

/* ---- 底部导航 ---- */
#tabs{
  position:absolute; left:0; right:0; bottom:0; z-index:16;
  height:var(--nav-total); padding-bottom:var(--safe-b);
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border-top:.5px solid var(--glass-line);
  box-shadow:0 -6px 24px var(--glass-shadow);
  transition:transform .34s var(--ease), opacity .24s;
}
/* 打字时让开。--nav-h 已经归零，这里只负责把它挪出画面。 */
body.typing #tabs{transform:translate3d(0,100%,0); opacity:0; pointer-events:none}
.tab{
  border:none; background:none; padding:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink-soft); font:inherit; font-size:10.5px; letter-spacing:.5px;
  opacity:.72; transition:color .2s, opacity .2s, transform .18s var(--ease);
}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:active{transform:scale(.9)}
.tab[aria-selected="true"]{color:var(--accent); opacity:1}
[data-theme="night"] .tab[aria-selected="true"]{color:var(--ink)}

/* ---- 顶栏 ---- */
header{
  position:relative; flex:none; z-index:20;
  padding:calc(var(--safe-t) + 10px) 12px 10px;
  display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px;
}
header::before{
  content:''; position:absolute; inset:0; z-index:-1;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--glass-line);
  -webkit-mask-image:linear-gradient(#000 72%,transparent);
  mask-image:linear-gradient(#000 72%,transparent);
}
.icon-btn{
  width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  border:none; padding:0; cursor:pointer; color:var(--ink);
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 3px 12px var(--glass-shadow), inset 0 .5px 0 rgba(255,255,255,.7);
  transition:transform .18s var(--ease), opacity .18s;
}
[data-theme="night"] .icon-btn{box-shadow:0 3px 12px var(--glass-shadow), inset 0 .5px 0 rgba(255,255,255,.12)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.title{text-align:center; min-width:0}
.title h1{margin:0; font-size:17px; font-weight:var(--w-strong); letter-spacing:var(--track); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.title .status{
  margin-top:2px; font-size:12px; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.title .status i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);opacity:.55}
.title .status.on i{background:#3fb96b;opacity:1}

/* ---- 消息区 ---- */
#scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
        padding:14px 16px calc(var(--nav-total) + 96px)}
#list{display:flex; flex-direction:column; gap:12px; max-width:760px; margin:0 auto}

.row{display:flex; animation:pop .34s var(--ease) both}
.row.me{justify-content:flex-end}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.985)}}

.bubble{
  max-width:82%; padding:12px 16px; border-radius:22px;
  white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
}
.row.ai .bubble{
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid var(--glass-line);
  border-bottom-left-radius:8px;
  box-shadow:0 6px 22px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55);
}
[data-theme="night"] .row.ai .bubble{box-shadow:0 6px 22px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.1)}
.row.me .bubble{
  background:var(--accent); color:var(--accent-ink);
  border-bottom-right-radius:8px;
  box-shadow:0 6px 20px color-mix(in srgb, var(--accent) 34%, transparent);
}
.bubble img{
  display:block; max-width:100%; border-radius:var(--r-md); margin:2px 0 8px;
  border:2px solid rgba(255,255,255,.6);
}
.bubble img:last-child{margin-bottom:2px}

/* 打字指示 */
.dots{display:flex; gap:5px; padding:3px 2px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);opacity:.4;animation:blink 1.3s infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

.empty{
  margin:16vh auto 0; text-align:center; color:var(--ink-soft); max-width:280px;
}
/* 空会话时的那只猫：跟图标同一套线稿，描边跟着主题走 */
.empty .mark{
  display:block; width:98px; height:auto; margin:0 auto 18px;
  fill:none; stroke:var(--ink-soft); stroke-width:3;
  stroke-linecap:round; stroke-linejoin:round; opacity:.42;
}
.empty p{margin:0; font-size:14px}

/* ---- 输入区 ---- */
#composer{
  position:absolute; left:0; right:0; bottom:var(--nav-total); z-index:15;
  padding:10px 16px 12px;
  max-width:760px; margin:0 auto;
  pointer-events:none;              /* 空白处不挡滚动 */
  transition:bottom .34s var(--ease);
}
/* 导航条让开之后，输入条接管底部的安全区 */
body.typing #composer{padding-bottom:calc(var(--safe-b) + 12px)}
#composer > *{pointer-events:auto}
#thumbs{display:flex; gap:8px; padding:0 4px 8px; flex-wrap:wrap}
.thumb{position:relative; width:62px;height:62px;border-radius:var(--r-sm); overflow:hidden; box-shadow:0 4px 14px var(--glass-shadow)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute; top:3px; right:3px; width:19px;height:19px;border-radius:50%;
  border:none; background:rgba(0,0,0,.55); color:#fff; font-size:12px; line-height:19px; padding:0; cursor:pointer;
}
.bar{
  display:flex; align-items:flex-end; gap:8px; padding:6px 6px 6px 18px;
  border-radius:var(--r-lg);
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glass-line);
  box-shadow:0 14px 38px var(--glass-shadow), 0 3px 10px var(--glass-shadow),
             inset 0 1px 0 rgba(255,255,255,.6);
}
[data-theme="night"] .bar{
  box-shadow:0 14px 38px var(--glass-shadow), 0 3px 10px var(--glass-shadow),
             inset 0 1px 0 rgba(255,255,255,.1);
}
#input{
  flex:1; border:none; background:none; resize:none; outline:none; color:var(--ink);
  font:inherit; line-height:1.45; padding:10px 0; max-height:132px; min-height:24px;
}
#input::placeholder{color:var(--ink-soft); opacity:.75}
.round{
  flex:none; width:38px;height:38px;border-radius:50%; border:none; cursor:pointer;
  display:grid; place-items:center; color:var(--ink-soft); background:transparent;
  transition:transform .18s var(--ease);
}
.round:active{transform:scale(.88)}
.round svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#send{background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
#send:disabled{opacity:.34; box-shadow:none}

/* ---- 遮罩 ---- */
.scrim{
  position:fixed; inset:0; z-index:40; background:rgba(20,16,32,.3);
  opacity:0; pointer-events:none; transition:opacity .34s var(--ease);
}
.scrim.show{opacity:1; pointer-events:auto}

/* ---- 侧栏 ---- */
#sidebar{
  position:fixed; z-index:50; top:0; bottom:0; left:0; width:min(80vw,320px);
  transform:translate3d(-102%,0,0); transition:transform .38s var(--ease);
  display:flex; flex-direction:column;
  padding:calc(var(--safe-t) + 18px) 14px calc(var(--safe-b) + 14px);
  background:var(--glass);
  -webkit-backdrop-filter:blur(40px) saturate(190%);
  backdrop-filter:blur(40px) saturate(190%);
  border-right:.5px solid var(--glass-line);
  box-shadow:14px 0 44px var(--glass-shadow);
}
#sidebar.open{transform:translate3d(0,0,0)}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px 16px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent));
  box-shadow:0 3px 10px var(--glass-shadow);
}
.brand b{font-size:19px; letter-spacing:var(--track); font-weight:var(--w-strong)}

.new-chat{
  width:100%; padding:13px; border-radius:var(--r-md); cursor:pointer;
  font:inherit; font-weight:var(--w-med); color:var(--ink);
  background:var(--glass-strong); border:.5px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  display:flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .18s var(--ease);
}
.new-chat:active{transform:scale(.975)}

.sec{font-size:11px; letter-spacing:2px; color:var(--ink-soft); padding:20px 8px 8px; text-transform:uppercase}
#sessions{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin:0 -4px; padding:0 4px}
.sess{
  display:flex; align-items:center; gap:8px; padding:11px 12px; border-radius:var(--r-sm);
  cursor:pointer; transition:background .18s;
}
.sess:active{background:var(--glass-strong)}
.sess.on{background:var(--glass-strong); border:.5px solid var(--glass-line)}
.sess span{flex:1; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sess button{
  flex:none; width:22px;height:22px;border:none;background:none;cursor:pointer;
  color:var(--ink-soft); opacity:.5; font-size:15px; line-height:1; padding:0;
}
.sess button:active{opacity:1}

.swatches{display:flex; gap:9px; padding:10px 8px 14px}

/* 字体选择：每个按钮用它自己代表的字体来显示，所见即所得 */
.fonts{display:flex; gap:7px; padding:2px 8px 0}
.fo{
  flex:1; padding:9px 4px; border-radius:var(--r-sm); cursor:pointer;
  font-size:15px; line-height:1.2; color:var(--ink);
  background:var(--glass-strong); border:.5px solid transparent;
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.5);
  transition:transform .18s var(--ease);
}
.fo:active{transform:scale(.94)}
.fo[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
[data-theme="night"] .fo[aria-pressed="true"]{color:var(--ink)}
.fo[data-f="wenkai"]{font-family:'LXGW WenKai',"STKaiti",serif}
.fo[data-f="wenkai-light"]{font-family:'LXGW WenKai Light',"STKaiti",serif}
.fo[data-f="kai"]{font-family:"STKaiti","Kaiti SC","KaiTi","楷体",serif}
.fo[data-f="sans"]{font-family:-apple-system,"PingFang SC",sans-serif}

/* 图标选择：按钮本身就是那个图标 */
.icons{display:flex; gap:10px; padding:2px 8px 0}
.ic{
  width:46px; height:46px; border-radius:12px; cursor:pointer; padding:0;
  background-size:cover; background-position:center;
  border:2px solid transparent; background-clip:padding-box;
  box-shadow:0 3px 10px var(--glass-shadow);
  transition:transform .2s var(--ease);
}
.ic:active{transform:scale(.9)}
.ic[aria-pressed="true"]{border-color:var(--accent); transform:scale(1.06)}
.tip{margin:12px 8px 0; font-size:11.5px; line-height:1.5; color:var(--ink-soft); opacity:.8}
.sw{
  width:36px;height:36px;border-radius:50%; cursor:pointer; padding:0;
  border:2px solid transparent; background-clip:padding-box;
  box-shadow:0 3px 10px var(--glass-shadow);
  transition:transform .2s var(--ease);
}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--accent); transform:scale(1.06)}
.sw[data-t="lavender"]{background:linear-gradient(135deg,#d9c2f0,#b8c9ef)}
.sw[data-t="lime"]{background:linear-gradient(135deg,#c8e89b,#9fd98c)}
.sw[data-t="milktea"]{background:linear-gradient(135deg,#e8d0ac,#cfa87c)}
.sw[data-t="rose"]{background:linear-gradient(135deg,#eed4de,#c9b4dc)}
.sw[data-t="bloom"]{background:radial-gradient(circle at 50% 50%,#e7c0d0 0 34%,#fffdfe 36%)}
.sw[data-t="night"]{background:linear-gradient(135deg,#2b2a4a,#151c33)}

/* ---- 页面通用 ---- */
/* 一块玻璃里放一组相关设置。分组比一长条列表好读，
   而且每块自己是浮层，液态玻璃才说得通。 */
.card{
  border-radius:var(--r-lg); padding:18px 16px; margin-bottom:14px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glass-line);
  box-shadow:0 8px 28px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="night"] .card{box-shadow:0 8px 28px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.08)}
.card > h2{margin:0 0 6px; font-size:18px; font-weight:var(--w-strong); letter-spacing:var(--track)}
.card > h2:not(:first-child){margin-top:22px}
.hint{margin:0 0 16px; font-size:13px; color:var(--ink-soft); line-height:1.55}
.hint code{
  font:inherit; font-size:.94em; padding:1px 5px; border-radius:6px;
  background:var(--glass-strong); border:.5px solid var(--glass-line);
}
.card .sec{padding:18px 4px 6px}
.card .sec:first-of-type{padding-top:4px}
.card .swatches,.card .fonts,.card .icons{padding-left:4px; padding-right:4px}
.card .tip{margin:12px 4px 0}

/* 还没做的页面 */
.soon{margin:14vh auto 0; text-align:center; color:var(--ink-soft); max-width:270px}
.soon .mark{
  display:block; width:78px; height:auto; margin:0 auto 16px;
  fill:none; stroke:var(--ink-soft); stroke-width:3;
  stroke-linecap:round; stroke-linejoin:round; opacity:.34;
}
.soon p{margin:0; font-size:14px; line-height:1.7}
label{display:block; font-size:13px; color:var(--ink-soft); margin:0 0 7px 4px}
.field{
  width:100%; padding:14px 16px; border-radius:var(--r-md); margin-bottom:16px;
  font:inherit; font-size:15px; color:var(--ink); outline:none;
  background:var(--glass-strong); border:.5px solid var(--glass-line);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.045);
}
.field::placeholder{color:var(--ink-soft); opacity:.6}
.field:focus{border-color:var(--accent)}
/* 记忆库开关 */
.toggle{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 16px; margin-bottom:12px; border-radius:var(--r-md); cursor:pointer;
  font:inherit; font-size:15px; color:var(--ink); text-align:left;
  background:var(--glass-strong); border:.5px solid var(--glass-line);
}
.toggle i{
  flex:none; width:46px; height:28px; border-radius:999px; position:relative;
  background:var(--ink-soft); opacity:.35; transition:background .22s, opacity .22s;
}
.toggle i::after{
  content:''; position:absolute; top:3px; left:3px; width:22px; height:22px;
  border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25);
  transition:transform .22s var(--ease);
}
.toggle[aria-checked="true"] i{background:var(--accent); opacity:1}
.toggle[aria-checked="true"] i::after{transform:translateX(18px)}

.primary{
  width:100%; padding:15px; border-radius:var(--r-md); border:none; cursor:pointer;
  font:inherit; font-weight:var(--w-strong); font-size:16px;
  background:var(--accent); color:var(--accent-ink);
  box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 38%,transparent);
  transition:transform .18s var(--ease);
}
.primary:active{transform:scale(.98)}
/* 危险动作用描边而不是实心：它不该跟「保存」抢眼睛 */
.danger{
  width:100%; padding:14px; border-radius:var(--r-md); cursor:pointer;
  font:inherit; font-size:15px; color:#c0526b;
  background:var(--glass-strong); border:.5px solid rgba(192,82,107,.4);
  transition:transform .18s var(--ease);
}
[data-theme="night"] .danger{color:#e08ea0; border-color:rgba(224,142,160,.34)}
.danger:active{transform:scale(.98)}

.toast{
  position:fixed; z-index:80; left:50%; bottom:calc(var(--nav-total) + 88px); transform:translate(-50%,14px);
  padding:11px 20px; border-radius:999px; font-size:14px; color:var(--ink);
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--glass-line); box-shadow:0 8px 26px var(--glass-shadow);
  opacity:0; pointer-events:none; transition:all .3s var(--ease);
}
.toast.show{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="bg"><i></i><i></i><i></i></div>
<div id="petals" aria-hidden="true"></div>

<svg id="defs" width="0" height="0" aria-hidden="true"><defs>
  <symbol id="fl" viewBox="0 0 64 64">
    <g fill="currentColor">
      <ellipse cx="32" cy="17" rx="9.5" ry="13.5"/>
      <ellipse cx="32" cy="17" rx="9.5" ry="13.5" transform="rotate(72 32 32)"/>
      <ellipse cx="32" cy="17" rx="9.5" ry="13.5" transform="rotate(144 32 32)"/>
      <ellipse cx="32" cy="17" rx="9.5" ry="13.5" transform="rotate(216 32 32)"/>
      <ellipse cx="32" cy="17" rx="9.5" ry="13.5" transform="rotate(288 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="4.4" fill="currentColor" opacity=".5"/>
  </symbol>
  <symbol id="pt" viewBox="0 0 64 64">
    <ellipse cx="32" cy="32" rx="9" ry="14" fill="currentColor" transform="rotate(-25 32 32)"/>
  </symbol>
  <!-- 窝在壁龛里的那只猫，跟图标同一套线稿。fill/stroke 都由外面的 .mark 给，
       所以同一个图在空会话、占位页里颜色各随各的主题。
       这里是 <g> 不是 <symbol>：<symbol> 带 viewBox 会再开一个视口，
       跟外层 svg 的 viewBox 叠两次，图就缩歪了。<g> 直接长在当前坐标系里。 -->
  <g id="cat">
    <path d="M50 152V98a40 40 0 0 1 80 0v54M42 152h96"/>
    <path d="M79 121l1-10 7 6M101 121l-1-10-7 6"/>
    <path d="M79 121q-3 11 3 15h16q6-4 3-15"/>
    <path d="M82 136q-5 10 2 16h12q7-6 2-16"/>
    <path d="M98 152q10 1 10-8"/>
    <path d="M86 126v4.5M94 126v4.5" stroke-width="2.6"/>
  </g>
</defs></svg>

<div id="app">
  <header>

      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

    <div class="title">
      <h1 id="chat-title">新的对话</h1>
      <div class="status" id="mem-status"><i></i><span>记忆库未连接</span></div>

    <div></div>
  </header>

  <main id="views">

    <section class="view on" id="v-chat">
      <div id="scroll"><div id="list"></div></div>
      <div id="composer">
        <div id="thumbs"></div>

          <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
          <button class="round" id="btn-pic" aria-label="添加图片">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="round" id="send" aria-label="发送" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden>
      </div>
    </section>

    <section class="view" id="v-memory">
      <div class="page"><div class="inner">
        <div class="soon">
          <svg class="mark" viewBox="40 50 100 110" aria-hidden="true"><use href="#cat"/></svg>
          <p>记忆库还没搬进来。<br>先把导航搭好，下一步接。</p>
        </div>
      </div></div>
    </section>

    <section class="view" id="v-journal">
      <div class="page"><div class="inner">
        <div class="soon">
          <svg class="mark" viewBox="40 50 100 110" aria-hidden="true"><use href="#cat"/></svg>
          <p>便签日记还没做。</p>
        </div>
      </div></div>
    </section>

    <section class="view" id="v-study">
      <div class="page"><div class="inner">
        <div class="soon">
          <svg class="mark" viewBox="40 50 100 110" aria-hidden="true"><use href="#cat"/></svg>
          <p>倒计时和打卡还没做。</p>
        </div>
      </div></div>
    </section>

    <section class="view" id="v-settings">
      <div class="page"><div class="inner">

        <div class="card">
          <h2>外观</h2>
          <div class="sec">主题</div>
          <div class="swatches">
            <button class="sw" data-t="lavender" aria-label="薰衣草紫"></button>
            <button class="sw" data-t="lime" aria-label="青柠"></button>
            <button class="sw" data-t="milktea" aria-label="奶茶"></button>
            <button class="sw" data-t="rose" aria-label="胭脂"></button>
            <button class="sw" data-t="bloom" aria-label="落花"></button>
            <button class="sw" data-t="night" aria-label="深夜"></button>
          </div>
          <div class="sec">字体</div>
          <div class="fonts">
            <button class="fo" data-f="wenkai" aria-label="霞鹜文楷">文楷</button>
            <button class="fo" data-f="wenkai-light" aria-label="霞鹜文楷 细">细楷</button>
            <button class="fo" data-f="kai" aria-label="系统楷体">楷体</button>
            <button class="fo" data-f="sans" aria-label="黑体">黑体</button>
          </div>
          <div class="sec">图标</div>
          <div class="icons">
            <button class="ic" data-i="night" aria-label="龛里"
                    style="background-image:url(icons/night-180.png)"></button>
            <button class="ic" data-i="night-left" aria-label="月在左"
                    style="background-image:url(icons/night-left-180.png)"></button>
            <button class="ic" data-i="day" aria-label="浅色"
                    style="background-image:url(icons/day-180.png)"></button>
          </div>
          <p class="tip">标签页立刻就换。主屏幕上那个是添加时存下来的，想换得删掉重加一次。</p>
        </div>

        <div class="card">
          <h2>连接</h2>
          <p class="hint">默认连同源的 <code>/api/chat</code>，跟后端一起部署时不用改。密钥留在服务器上，前端碰不到。</p>
          <label for="f-api">服务器地址</label>
          <input class="field" id="f-api" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="/api/chat">
          <label>记忆库</label>
          <button class="toggle" id="f-memory" role="switch" aria-checked="true">
            <span>让它记得我们聊过什么</span><i></i>
          </button>
          <p class="hint" id="mem-detail" style="margin:-4px 0 16px 4px;font-size:12.5px"></p>
          <label>联网搜索</label>
          <button class="toggle" id="f-web" role="switch" aria-checked="true">
            <span>需要时让它去查网上</span><i></i>
          </button>
          <p class="hint" style="margin:-4px 0 16px 4px;font-size:12.5px">搜不搜由它自己判断，不是每句话都搜。</p>
          <button class="primary" id="btn-save">保存</button>
        </div>

        <div class="card">
          <h2>会话</h2>
          <p class="hint">全部对话都存在这台设备的浏览器里，从没上传过。清掉就找不回来了。</p>
          <button class="danger" id="btn-wipe">清空所有对话</button>

      </div></div>
    </section>

  </main>

  <nav id="tabs" role="tablist">
    <button class="tab" data-v="chat" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M20 12a7.5 7.5 0 0 1-7.5 7.5c-1.2 0-2.3-.25-3.3-.7L4.5 20l1.3-4.3A7.5 7.5 0 1 1 20 12z"/></svg>
      聊天
    </button>
    <button class="tab" data-v="memory" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M9 3.6h6M9.8 3.6v2.2M14.2 3.6v2.2"/><path d="M7 9a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v8.5a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z"/><circle cx="10.6" cy="12.6" r="1.05" fill="currentColor" stroke="none"/><circle cx="13.8" cy="15.6" r="1.05" fill="currentColor" stroke="none"/></svg>

    </button>
    <button class="tab" data-v="journal" role="tab" aria-selected="false">

      日记

    <button class="tab" data-v="study" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10h16M8.5 3v4M15.5 3v4M9 15l2 2 4-4"/></svg>
      进度
    </button>
    <button class="tab" data-v="settings" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<aside id="sidebar">
  <div class="brand"><div class="mark"></div><b>Alcove</b></div>
  <button class="new-chat" id="btn-new">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    开始新的对话
  </button>
  <div class="sec">对话</div>
  <div id="sessions"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const $  = s => document.querySelector(s);
const KEY = { sessions:'alcove.sessions', current:'alcove.current', theme:'alcove.theme', font:'alcove.font', icon:'alcove.icon', conf:'alcove.conf', tab:'alcove.tab' };

const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- 状态 ---------- */
let sessions = load(KEY.sessions, []);
let currentId = load(KEY.current, null);
/* 同源 /api/chat 是默认后端，页面跟它一起部署时开箱即用。
   若该路径不存在（比如页面被单独挂到别处），退回本地演示模式。 */
const SAME_ORIGIN_API = '/api/chat';
let conf = load(KEY.conf, { api:SAME_ORIGIN_API, memory:true, web:true });
// 从旧版本升上来的配置可能缺这两项
if (conf.memory === undefined) conf.memory = true;
if (conf.web === undefined) conf.web = true;
let pending = [];          // 待发送的图片
let busy = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function current(){
  let s = sessions.find(x => x.id === currentId);
  if (!s) { s = newSession(false); }
  return s;
}
function newSession(render = true){
  const s = { id: uid(), title: '新的对话', messages: [], at: Date.now() };
  sessions.unshift(s);
  currentId = s.id;
  persist();
  if (render) { drawAll(); }
  return s;
}
function persist(){ save(KEY.sessions, sessions); save(KEY.current, currentId); }

/* ---------- 标签页 ---------- */
/* 顶栏跟着 tab 走：只有聊天页需要会话列表和那个会变的标题，
   其余四页是固定标题，汉堡按钮藏起来。 */
const TABS = {
  chat:     { title:null,    menu:true  },
  memory:   { title:'记忆库', menu:false },
  journal:  { title:'便签日记', menu:false },
  study:    { title:'考研进度', menu:false },
  settings: { title:'设置',   menu:false },
};
let tab = 'chat';

function setTab(v){
  if (!TABS[v]) v = 'chat';
  tab = v;
  save(KEY.tab, v);
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v' + '-' + v));
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === v)));

  const meta = TABS[v];
  $('#btn-menu').style.visibility = meta.menu ? '' : 'hidden';
  $('#mem-status').style.display  = v === 'chat' ? '' : 'none';
  $('#chat-title').textContent    = meta.title || current().title || '新的对话';
  if (v === 'settings') fillSettings();
  closePanels();
}

/* ---------- 主题 ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  save(KEY.theme, t);
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
  const c = getComputedStyle(document.documentElement).getPropertyValue('--bg-2').trim();
  document.querySelector('meta[name=theme-color]').content = c || '#e8e4f3';
}
/* 图标换的是 <link> 的 href。标签页图标会立刻跟着变；
   主屏幕上那个不会——iOS 在"添加到主屏幕"那一刻就把图存进系统了，
   之后网页再改也够不着它，只能删掉重加。 */
function setIcon(i){
  save(KEY.icon, i);
  $('#fav').href = `icons/${i}.svg`;
  $('#fav-apple').href = `icons/${i}-180.png`;
  document.querySelectorAll('.ic').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.i === i)));
}
function setFont(f){
  document.documentElement.dataset.font = f;
  save(KEY.font, f);
  document.querySelectorAll('.fo').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
}

/* ---------- 落花 ----------
   位置写死不随机：随机每次刷新都换一个样子，读起来像页面没稳住。
   全部贴着两侧和四角，中间那条竖直的阅读区留空。
   fl 是整朵花，pt 是单片花瓣——大的少、小的多，才不像贴纸。 */
const PETALS = [
  /* left%  top%  px  秒  延迟  起始角    dx      dy   形状 */
  [   2,    6,   62, 34,   0,  -10, ' 16px', '-22px', 'fl'],
  [  84,    9,   46, 29,  -7,   18, '-14px', '-26px', 'fl'],
  [  -3,   26,   38, 26,  -3,   34, ' 12px', ' 18px', 'pt'],
  [  90,   30,   28, 23, -11,  -22, '-16px', ' 20px', 'pt'],
  [   6,   46,   24, 21,  -5,   62, ' 14px', ' 16px', 'pt'],

$('#petals').innerHTML = PETALS.map(([x, y, size, dur, delay, rot, dx, dy, kind]) =>
  `<svg class="pt" viewBox="0 0 64 64" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;` +

/* ---------- 渲染 ---------- */
function drawMessages(){
  const list = $('#list'), s = current();
  list.innerHTML = '';
  if (!s.messages.length){
    list.insertAdjacentHTML('beforeend',
      '<div class="empty">' +
      '<svg class="mark" viewBox="40 50 100 110" aria-hidden="true"><use href="#cat"/></svg>' +
      '<p>新的一页。说点什么都行。</p></div>');
  }
  for (const m of s.messages){
    const row = document.createElement('div');
    row.className = 'row ' + (m.role === 'user' ? 'me' : 'ai');
    const b = document.createElement('div');
    b.className = 'bubble';
    (m.images || []).forEach(src => {
      const img = new Image(); img.src = src; img.loading = 'lazy'; b.appendChild(img);
    });
    if (m.text){ b.appendChild(document.createTextNode(m.text)); }
    row.appendChild(b); list.appendChild(row);
  }
  // 别的 tab 上顶栏写的是那一页的名字，不能被会话标题顶掉
  if (tab === 'chat') $('#chat-title').textContent = s.title;
  scrollDown();
}
function drawSessions(){
  const box = $('#sessions');
  box.innerHTML = '';
  for (const s of sessions){
    const el = document.createElement('div');
    el.className = 'sess' + (s.id === currentId ? ' on' : '');
    el.innerHTML = '<span></span><button aria-label="删除">✕</button>';
    el.querySelector('span').textContent = s.title;
    el.onclick = () => { currentId = s.id; persist(); drawAll(); closePanels(); };
    el.querySelector('button').onclick = e => { e.stopPropagation(); removeSession(s.id); };
    box.appendChild(el);
  }
}
function removeSession(id){
  sessions = sessions.filter(s => s.id !== id);
  if (currentId === id){ currentId = sessions[0] ? sessions[0].id : null; }
  if (!sessions.length){ newSession(false); }
  persist(); drawAll();
}
function drawAll(){ drawMessages(); drawSessions(); }
function scrollDown(){ requestAnimationFrame(() => { const s = $('#scroll'); s.scrollTop = s.scrollHeight; }); }

/* 记忆库的死活由后端说了算，不是由前端填没填地址决定的——
   问 /api/memory/status，它探一下 Ombre Brain 的 /health 再回话。 */
function statusUrl(){
  return /\/chat$/.test(conf.api) ? conf.api.replace(/\/chat$/, '/memory/status') : '';
}
function paintStatus(on, label, detail){
  const el = $('#mem-status');
  el.classList.toggle('on', on);
  el.querySelector('span').textContent = label;
  const d = $('#mem-detail');
  if (d) d.textContent = detail || '';
}
async function drawStatus(){
  if (!conf.memory){ paintStatus(false, '记忆库已关闭', '这台设备上不检索记忆。'); return; }
  const url = statusUrl();
  if (!url){ paintStatus(false, '记忆库未知', '服务器地址不是标准的 /api/chat，探测不了。'); return; }
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.ok){ paintStatus(true, '记忆库已连接', '后端探活正常。'); }
    else { paintStatus(false, '记忆库连不上', '后端探活失败：' + ((data && (data.error || data.status_code)) || '未知原因')); }
  } catch {
    paintStatus(false, '记忆库未知', '探测请求本身失败了。');
  }
}
function drawThumbs(){
  const box = $('#thumbs');
  box.innerHTML = '';
  pending.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = '<button aria-label="移除">✕</button>';
    const img = new Image(); img.src = src; d.prepend(img);
    d.querySelector('button').onclick = () => { pending.splice(i, 1); drawThumbs(); };
    box.appendChild(d);
  });
  refreshSend();
}
function refreshSend(){
  $('#send').disabled = busy || (!$('#input').value.trim() && !pending.length);
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ---------- 面板 ---------- */
function openSidebar(){ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closePanels(){
  $('#sidebar').classList.remove('open');
  $('#scrim').classList.remove('show');
}
/* 设置页是一直在 DOM 里的，进去时把当前值填一遍，免得显示的是上一次的 */
function fillSettings(){
  $('#f-api').value = conf.api;
  $('#f-memory').setAttribute('aria-checked', String(conf.memory !== false));
  $('#f-web').setAttribute('aria-checked', String(conf.web !== false));
  drawStatus();
}

/* ---------- 图片 ---------- */
const MAX_EDGE = 1400;
function readImage(file){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
        if (scale === 1 && fr.result.length < 900000){ return resolve(fr.result); }
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(null);
      img.src = fr.result;
    };
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(file);
  });
}

/* ---------- 发送 ---------- */
function toApiContent(m){
  const blocks = [];
  for (const src of (m.images || [])){
    const match = /^data:(image\/[a-z+]+);base64,(.*)$/i.exec(src);
    if (match){
      blocks.push({ type:'image', source:{ type:'base64', media_type:match[1], data:match[2] } });
    }
  }
  if (m.text){ blocks.push({ type:'text', text:m.text }); }
  return blocks.length === 1 && blocks[0].type === 'text' ? m.text : blocks;
}

const DEMO = '演示模式：这份页面旁边没有后端。\n\n把服务器地址填进设置里，这里就会换成真的回复。界面的其余部分都是能用的——多开对话、换主题、发图片，随便试。';

async function send(){
  const text = $('#input').value.trim();
  if (busy || (!text && !pending.length)) return;

  const s = current();
  s.messages.push({ role:'user', text, images:pending.slice() });
  if (s.title === '新的对话'){
    s.title = (text || '图片').slice(0, 18) || '图片';
  }
  s.at = Date.now();
  pending = [];
  $('#input').value = ''; $('#input').style.height = 'auto';
  drawThumbs(); persist(); drawAll();

  busy = true; refreshSend();
  const row = document.createElement('div');
  row.className = 'row ai';
  row.innerHTML = '<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>';
  $('#list').appendChild(row); scrollDown();

  let reply;
  try {
    reply = conf.api ? await callApi(s.messages) : await demo();
  } catch (err) {
    reply = '没能连上服务器。\n\n' + (err && err.message ? err.message : String(err));
  }
  row.remove();
  s.messages.push({ role:'assistant', text:reply });
  s.at = Date.now();
  busy = false;
  persist(); drawAll(); refreshSend();
}

function demo(){ return new Promise(r => setTimeout(() => r(DEMO), 650)); }

async function callApi(messages){
  const body = {
    messages: messages.map(m => ({ role:m.role, content:toApiContent(m) })),
    use_memory: conf.memory !== false,
    use_web: conf.web !== false,
  };

  // 默认地址是猜的，不是用户填的：它打不通只说明这份页面旁边没有后端，
  // 不值得报错。用户自己填过地址就照实汇报，那种情况值得他知道。
  const isDefault = conf.api === SAME_ORIGIN_API;

  let res;
  try {
    res = await fetch(conf.api, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
  } catch (err) {
    if (isDefault) return DEMO;
    throw err;
  }
  if (!res.ok){
    if (isDefault && (res.status === 404 || res.status === 405)) return DEMO;
    throw new Error('HTTP ' + res.status + ' ' + (res.statusText || ''));
  }
  const data = await res.json();
  const text = (data.content || [])
    .filter(b => b && b.type === 'text')
    .map(b => b.text)
    .join('\n')
    .trim();
  return text || (typeof data.text === 'string' ? data.text : '(服务器返回了空回复)');
}

/* ---------- 绑定 ---------- */
$('#btn-menu').onclick = openSidebar;
$('#scrim').onclick    = closePanels;
$('#btn-new').onclick  = () => { newSession(); closePanels(); };
$('#send').onclick     = send;
$('#btn-pic').onclick  = () => $('#file').click();

document.querySelectorAll('.tab').forEach(b => { b.onclick = () => setTab(b.dataset.v); });

$('#file').onchange = async e => {
  const files = [...e.target.files].slice(0, 6);
  e.target.value = '';
  for (const f of files){
    const src = await readImage(f);
    if (src) pending.push(src);
  }
  drawThumbs();
};

$('#input').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 132) + 'px';
  refreshSend();
});
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send(); }
});
/* 打字时导航条让开。手机上键盘弹起来以后，输入条 + 导航条两层
   压在一起太占地方，正在写的字反而看不见几行。 */
$('#input').addEventListener('focus', () => document.body.classList.add('typing'));
$('#input').addEventListener('blur',  () => document.body.classList.remove('typing'));

document.querySelectorAll('.sw').forEach(b => { b.onclick = () => setTheme(b.dataset.t); });
document.querySelectorAll('.fo').forEach(b => { b.onclick = () => setFont(b.dataset.f); });
document.querySelectorAll('.ic').forEach(b => { b.onclick = () => setIcon(b.dataset.i); });

document.querySelectorAll('.toggle').forEach(t => {
  t.onclick = function(){
    this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  };
});

$('#btn-save').onclick = () => {
  conf = {
    api: $('#f-api').value.trim(),
    memory: $('#f-memory').getAttribute('aria-checked') === 'true',
    web: $('#f-web').getAttribute('aria-checked') === 'true',
  };
  save(KEY.conf, conf);
  drawStatus();
  toast(conf.api ? '已连接到你的服务器' : '已切回演示模式');
};

/* 清空是不可逆的，所以要点两次：第一次把按钮变成「真的清空？」 */
let wipeArmed = false, wipeTimer;
$('#btn-wipe').onclick = function(){
  if (!wipeArmed){
    wipeArmed = true;
    this.textContent = '真的清空？再点一次';
    clearTimeout(wipeTimer);
    wipeTimer = setTimeout(() => { wipeArmed = false; this.textContent = '清空所有对话'; }, 4000);
    return;
  }
  clearTimeout(wipeTimer);
  wipeArmed = false;
  this.textContent = '清空所有对话';
  sessions = []; currentId = null;
  newSession(false); persist(); drawAll();
  toast('对话已清空');
};

// 粘贴图片
document.addEventListener('paste', async e => {
  const items = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault();
  for (const it of items){
    const src = await readImage(it.getAsFile());
    if (src) pending.push(src);
  }
  drawThumbs();
});

/* 清掉旧版本留下的 Service Worker（见 sw.js）。这里不做离线缓存。 */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ---------- 启动 ---------- */
setTheme(load(KEY.theme, 'lavender'));
setFont(load(KEY.font, 'wenkai'));
setIcon(load(KEY.icon, 'night'));
if (!sessions.length) newSession(false);
drawStatus(); drawAll(); refreshSend();
setTab(load(KEY.tab, 'chat'));

})();
</script>
