# 复制成 config.toml 再填。config.toml 存明文密码，已在 .gitignore 里，不会进仓库
[site]
base = "http://order.lib.zzu.edu.cn"
h5 = "http://order.lib.zzu.edu.cn/h5/index.html"

[account]
# 学号，密码同校园网
username = ""
password = ""

[booking]
# 每天这个点放次日的位子，北京时间
open_at = "07:30:00"
# 提前多久登录好
login_ahead_sec = 60
# 系统只给这一个时段
start = "07:30"
end = "22:30"

# 座位优先级，从上往下试，第一个成功就停。
# id 要等探路脚本跑完才知道真实值长什么样，label 只是给日志看的
seats = [
  { id = "", label = "三楼中 006" },
]

[retry]
times = 8
interval = 0.4

[notify]
bark_url = ""      # 形如 https://api.day.app/你的key
webhook = ""
serverchan = ""    # 形如 https://sctapi.ftqq.com/你的key.send
