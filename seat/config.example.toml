# 复制成 config.toml 再填，config.toml 不进仓库
[site]
# 截图里 URL 被截断了，按实际填
base = "http://order.lib.zzu.edu.cn"

[account]
username = ""
password = ""

[booking]
# 开放时刻，北京时间。系统每天这个点放次日的位子
open_at = "07:30:00"
# 提前多久登录好
login_ahead_sec = 60
# 想约的时段，24 小时制
start = "08:00"
end = "22:00"

# 座位优先级，从上往下试，第一个成功就停
# id 填抓包里那个座位的真实标识（dev_id / seat_id 之类）
seats = [
  { id = "", label = "一楼靠窗 A12" },
  { id = "", label = "一楼靠窗 A13" },
]

[retry]
# 抢不到时的重试：次数和间隔（秒）
times = 8
interval = 0.4

[notify]
# 三选一或都不填。都不填就只写日志
bark_url = ""      # 形如 https://api.day.app/你的key
webhook = ""       # 任意接收 POST JSON 的地址
serverchan = ""    # 形如 https://sctapi.ftqq.com/你的key.send
